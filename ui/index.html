<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamProctor — Online Exam Proctoring System</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ═══════════════════ SIDEBAR ═══════════════════ -->
<aside class="sidebar">
  <div class="logo" onclick="showPage('dashboard')" title="Go to Dashboard">
    <div class="logo-icon">🛡️</div>
    <div>
      <h1>ExamProctor</h1>
      <span>v1.0 · DBMS Project</span>
    </div>
  </div>

  <!-- Populated by renderNav() in app.js -->
  <nav class="nav"></nav>

  <div class="sidebar-footer">
    <div class="user-card">
      <div class="avatar">PA</div>
      <div class="user-info">
        <div class="name">Proctor Admin</div>
        <div class="role">Administrator</div>
      </div>
    </div>
  </div>
</aside>

<!-- ═══════════════════ MAIN ═══════════════════ -->
<main class="main">

  <!-- ─── TOPBAR ─── -->
  <div class="topbar">
    <h2 id="page-title">Dashboard</h2>
    <div class="topbar-actions">
      <span class="topbar-status">🟢 DB Connected · ExamProctor</span>
      <button type="button" class="btn btn-outline" onclick="window.location='/api/export'">Export Report</button>
      <button type="button" class="btn btn-primary" onclick="showCreateExamModal()">+ New Exam</button>
    </div>
  </div>

  <!-- Page containers — content injected by app.js -->
  <div class="page" id="page-dashboard"></div>
  <div class="page" id="page-monitor"></div>
  <div class="page" id="page-exams"></div>
  <div class="page" id="page-questions"></div>
  <div class="page" id="page-student-view"></div>
  <div class="page" id="page-flagged"></div>
  <div class="page" id="page-logs"></div>
  <div class="page" id="page-analytics"></div>
  <div class="page" id="page-schema"></div>
  <div class="page" id="page-results"></div>

</main>

<!-- ═══════════════════ MODAL ═══════════════════ -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
